# CIEA reproduction: only cross-modal complementarity (no S_j, no R_j)
seed: 42
device: cuda
output_dir: outputs/ablation_ciea

data:
  train_path: data/processed/mocheg_train.jsonl
  val_path: data/processed/mocheg_val.jsonl
  test_path: data/processed/mocheg_test.jsonl
  image_root: data/raw/mocheg/images
  max_claim_len: 64
  max_evidence_len: 128
  image_size: 224
  num_workers: 4
  hard_negatives_per_sample: 0

model:
  text_encoder: bert-base-uncased
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 768
  projector_out_dim: 768
  fusion_num_layers: 2
  fusion_num_heads: 8
  fusion_hidden_dim: 768

weighting:
  use_claim_relevance: false
  use_complementarity: true
  use_entropy_reliability: false
  entropy_scheme: A
  entropy_K: 1000
  entropy_concepts_path: null
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 0.5
  use_complementary_loss: true

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_epochs: 10
  batch_size: 32
  grad_accum_steps: 1
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20, 100]
  use_faiss: false
