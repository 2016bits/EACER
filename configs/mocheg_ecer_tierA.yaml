# Tier A architecture applied to MOCHEG, using BGE-M3 lr=2e-5 (Step 2's winning
# combo). MOCHEG is English-only and ~2.5x smaller than MR2 (7.5k train claims
# vs 11k, with ~2.5 evidences/claim vs ~8), so each epoch is much shorter and
# we can afford slightly bigger effective batch.

seed: 42
device: cuda
output_dir: outputs/mocheg_ecer_tierA

data:
  train_path: data/processed/mocheg/mocheg_train_hardneg.jsonl
  val_path:   data/processed/mocheg/mocheg_val.jsonl
  test_path:  data/processed/mocheg/mocheg_test.jsonl
  image_root: ""
  max_claim_len: 64
  max_evidence_len: 192            # MOCHEG evidence text is longer than MR2 (3-4x)
  image_size: 224
  num_workers: 4
  hard_negatives_per_sample: 4

model:
  text_encoder: BAAI/bge-m3
  text_pooling: cls
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 1024
  fusion_num_layers: 2
  fusion_num_heads: 8
  use_claim_image: true

weighting:
  use_claim_relevance: true
  use_complementarity: true
  use_entropy_reliability: true
  entropy_scheme: A
  entropy_K: 1000
  entropy_concepts_path: null
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 2.0
  use_complementary_loss: true

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_epochs: 10
  batch_size: 8
  grad_accum_steps: 4
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20, 100]
  use_faiss: true
  early_stopping_metric: Recall@10
  early_stopping_patience: 3
