# Baseline multimodal retriever on MR2 (no weighting tricks).
# Used as the ablation baseline (none of S/D/R/L_comp).
seed: 42
device: cuda
output_dir: outputs/mr2_base

data:
  train_path: data/processed/mr2/mr2_train.jsonl
  val_path:   data/processed/mr2/mr2_val.jsonl
  test_path:  data/processed/mr2/mr2_test.jsonl
  image_root: ""                # MR2 JSONL stores absolute paths already
  max_claim_len: 64
  max_evidence_len: 128
  image_size: 224
  num_workers: 4
  hard_negatives_per_sample: 0

model:
  # MR2 captions and pages are mostly Chinese; use a multilingual encoder.
  text_encoder: xlm-roberta-base
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 768
  projector_out_dim: 768
  fusion_num_layers: 2
  fusion_num_heads: 8
  fusion_hidden_dim: 768

weighting:
  use_claim_relevance: false       # S_j
  use_complementarity: false       # D_j
  use_entropy_reliability: false   # R_j
  entropy_scheme: A
  entropy_K: 1000
  entropy_concepts_path: null
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 0.0
  use_complementary_loss: false

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_epochs: 5
  batch_size: 32
  grad_accum_steps: 1
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20, 100]
  use_faiss: true
