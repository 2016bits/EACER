# Same as mr2_ecer_hardneg_cap.yaml but with λ=0.5 — the value that gave
# the best CIEA-full result. Hypothesis: with caption-target masking the
# alignment loss is easier to satisfy (fewer tokens masked), so the
# REPORT.md-optimal λ=2.0 may now over-weight L_comp; λ=0.5 may be a better
# balance.

seed: 42
device: cuda
output_dir: outputs/mr2_ecer_hardneg_cap_l05

data:
  train_path: data/processed/mr2/mr2_train_hardneg.jsonl
  val_path:   data/processed/mr2/mr2_val.jsonl
  test_path:  data/processed/mr2/mr2_test.jsonl
  image_root: ""
  max_claim_len: 64
  max_evidence_len: 128
  image_size: 224
  num_workers: 4
  hard_negatives_per_sample: 4

model:
  text_encoder: xlm-roberta-base
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 768
  projector_out_dim: 768
  fusion_num_layers: 2
  fusion_num_heads: 8
  fusion_hidden_dim: 768

weighting:
  use_claim_relevance: true
  use_complementarity: true
  use_entropy_reliability: true
  entropy_scheme: A
  entropy_K: 1000
  entropy_concepts_path: null
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 0.5
  use_complementary_loss: true
  comp_target: caption

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_epochs: 5
  batch_size: 16
  grad_accum_steps: 2
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20, 100]
  use_faiss: true
  early_stopping_metric: Recall@10
  early_stopping_patience: 0
