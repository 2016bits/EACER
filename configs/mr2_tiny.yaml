# Tiny smoke-training config: 200 train / 100 val claims, 3 epochs.
# Goal: verify the real xlm-roberta + CLIP pipeline runs end-to-end and
# loss/Recall@K move in the right direction. Generate the subsets with:
#   python scripts/make_tiny_subsets.py
seed: 42
device: cuda
output_dir: outputs/mr2_tiny

data:
  train_path: data/processed/mr2_tiny/mr2_train.jsonl
  val_path:   data/processed/mr2_tiny/mr2_val.jsonl
  test_path:  data/processed/mr2_tiny/mr2_test.jsonl
  image_root: ""                   # JSONL stores absolute paths
  max_claim_len: 64
  max_evidence_len: 128
  image_size: 224
  num_workers: 2
  hard_negatives_per_sample: 1

model:
  text_encoder: xlm-roberta-base
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 768
  projector_out_dim: 768
  fusion_num_layers: 2
  fusion_num_heads: 8
  fusion_hidden_dim: 768

weighting:
  use_claim_relevance: true        # exercise S
  use_complementarity: true        # exercise D
  use_entropy_reliability: true    # exercise R (downloads CLIP text tower on first run)
  entropy_scheme: A
  entropy_K: 1000
  entropy_concepts_path: null      # null -> use the 60-word built-in fallback
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 0.5
  use_complementary_loss: true     # exercise both losses

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_epochs: 3
  batch_size: 8
  grad_accum_steps: 1
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20]
  use_faiss: false                 # tiny pool — torch matmul is plenty
