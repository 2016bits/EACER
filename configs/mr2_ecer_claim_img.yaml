# Step 2: ECER + claim image. Builds on the Step 3 hardneg config and
# additionally feeds the claim's own image through the shared CLIP vision
# tower, mean-pools its projected patches, and residually fuses them into
# the claim's text-pooled representation.
#
# The residual gate is zero-initialised so at step 0 the model behaves
# identically to the text-only hardneg model — training only has to learn
# *how much* visual signal to add, not learn the full claim encoder from
# scratch.

seed: 42
device: cuda
output_dir: outputs/mr2_ecer_claim_img

data:
  train_path: data/processed/mr2/mr2_train_hardneg.jsonl
  val_path:   data/processed/mr2/mr2_val.jsonl
  test_path:  data/processed/mr2/mr2_test.jsonl
  image_root: ""
  max_claim_len: 64
  max_evidence_len: 128
  image_size: 224
  num_workers: 4
  hard_negatives_per_sample: 4

model:
  text_encoder: xlm-roberta-base
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 768
  projector_out_dim: 768
  fusion_num_layers: 2
  fusion_num_heads: 8
  fusion_hidden_dim: 768
  use_claim_image: true                                  # << Step 2 switch

weighting:
  use_claim_relevance: true
  use_complementarity: true
  use_entropy_reliability: true
  entropy_scheme: A
  entropy_K: 1000
  entropy_concepts_path: null
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 2.0
  use_complementary_loss: true

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_epochs: 5
  batch_size: 16
  grad_accum_steps: 2
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20, 100]
  use_faiss: true
