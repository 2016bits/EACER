# "Best of best" ECER: combines the two strongest findings from the
# sensitivity sweep:
#   - complementary_lambda = 2.0   (best λ from {0.1, 0.3, 0.5, 1.0, 2.0})
#   - entropy_K = 58, fallback     (beats K=1000 ImageNet because the
#                                   60 hand-picked tokens align with MR2's
#                                   news/protest/weapon/text visual content)
#   - entropy_scheme = A           (high-entropy suppression, beats scheme B)
#
# This is the configuration you should use as Full ECER in the final paper.
seed: 42
device: cuda
output_dir: outputs/mr2_ecer_best

data:
  train_path: data/processed/mr2/mr2_train.jsonl
  val_path:   data/processed/mr2/mr2_val.jsonl
  test_path:  data/processed/mr2/mr2_test.jsonl
  image_root: ""
  max_claim_len: 64
  max_evidence_len: 128
  image_size: 224
  num_workers: 4
  hard_negatives_per_sample: 1

model:
  text_encoder: xlm-roberta-base
  visual_encoder: openai/clip-vit-base-patch32
  freeze_visual: true
  freeze_text: false
  projector_hidden_dim: 768
  projector_out_dim: 768
  fusion_num_layers: 2
  fusion_num_heads: 8
  fusion_hidden_dim: 768

weighting:
  use_claim_relevance: true
  use_complementarity: true
  use_entropy_reliability: true
  entropy_scheme: A                    # high-entropy suppression
  entropy_K: 1000                      # ignored when concepts_path is null
  entropy_concepts_path: null          # null -> 60-word built-in fallback (wins)
  entropy_mu: 4.0
  entropy_sigma: 1.5
  softmax_temperature: 1.0

loss:
  contrastive_temperature: 0.07
  complementary_lambda: 2.0            # 4x the default 0.5
  use_complementary_loss: true

optim:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_epochs: 5
  batch_size: 32
  grad_accum_steps: 1
  max_grad_norm: 1.0

eval:
  recall_k: [1, 5, 10, 20, 100]
  use_faiss: true
